<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Shreyas Acharya | Senior Frontend Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--blue:#007BA7;--pink:#ff2d95;--blue-l:#3cc0ec;--pink-l:#ff6db8;--ink:#f3f4f6;--mute:#9aa3ad;--line:rgba(255,255,255,.09);--panel:#121416;
--display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Instrument Sans','Segoe UI',system-ui,sans-serif;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:-.02em}
/* backdrop */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
radial-gradient(600px 420px at var(--mx,70%) var(--my,10%),rgba(255,45,149,.16),transparent 70%),
radial-gradient(800px 500px at 0% 0%,rgba(0,123,167,.22),transparent 70%),var(--bg)}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 30% 20%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 30% 20%,#000 0,transparent 70%)}
/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,10,10,.7);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 22px var(--display);letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--pink)}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:15px;color:var(--mute)}
nav ul a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:16px;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;font-family:var(--body)}
.btn.pri{background:var(--pink);color:#0A0A0A}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px var(--pink)}
.btn.sec{border-color:var(--blue);color:var(--blue-l)}
.btn.sec:hover{background:rgba(0,123,167,.18)}
.btn.sm{padding:9px 18px;font-size:14px}
/* hero */
.hero{padding:72px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(46px,8.4vw,104px);font-weight:800}
.hero h1 span{display:block;background:linear-gradient(95deg,var(--blue-l),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 8s ease-in-out infinite alternate;background-size:160% 100%}
@keyframes hue{to{background-position:100% 0}}
.role{font:500 22px var(--display);color:var(--blue-l);margin:22px 0 10px;min-height:1.5em}
.role b{display:inline-block;width:2px;height:1em;background:var(--pink);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{color:var(--mute);max-width:520px;margin:0 0 30px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
/* hero lab */
.lab{background:linear-gradient(160deg,#15181b,#0d0e10);border:1px solid var(--line);border-radius:22px;padding:22px;position:relative;box-shadow:0 30px 80px -30px rgba(0,123,167,.55)}
.lab::before{content:"";position:absolute;inset:-1px;border-radius:23px;padding:1px;background:linear-gradient(140deg,var(--blue),transparent 40%,var(--pink));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tabs{display:inline-flex;background:#08090a;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{all:unset;cursor:pointer;padding:8px 16px;border-radius:999px;font-size:14px;color:var(--mute);transition:.25s}
.tabs button[aria-pressed=true]{background:var(--blue);color:#fff}
.tabs button.fast[aria-pressed=true]{background:var(--pink);color:#0A0A0A}
.tabs button:focus-visible{outline:2px solid var(--pink)}
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0b0c}
.mock .bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.mock .bar i{width:9px;height:9px;border-radius:50%;background:#2a2f34}
.mock .body{padding:16px;display:grid;gap:10px;min-height:150px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#1b1f23 25%,#262b30 50%,#1b1f23 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.sk.real{animation:none;background:linear-gradient(90deg,var(--blue),var(--blue-l))}
.sk.real.p{background:linear-gradient(90deg,var(--pink),var(--pink-l))}
@keyframes sh{to{background-position:-200% 0}}
.meter{margin-top:18px}
.meter .t{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:6px}
.meter .t strong{color:var(--ink);font:800 26px var(--display)}
.track{height:8px;border-radius:8px;background:#1b1f23;overflow:hidden}
.track div{height:100%;border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1),background .4s}
/* 3D portrait */
.about{display:grid;grid-template-columns:500px 1fr;gap:32px;align-items:center;padding:40px 0 24px}
.stage{height:580px;display:grid;place-items:center;perspective:1300px;position:relative;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.stage::before{content:"";position:absolute;width:400px;height:400px;border-radius:50%;background:conic-gradient(from 0deg,var(--blue),var(--pink),var(--blue));filter:blur(70px);opacity:.42;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.zoom{width:0;height:0;transform-style:preserve-3d;position:relative}
.scene{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.fig{position:absolute;left:-150px;top:-178px;width:300px;height:357px;transform-style:preserve-3d}
.fig .sl,.fig .ph{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.fade,.sl{-webkit-mask-size:100% 100%;mask-size:100% 100%}
.fade{-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 100%),linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 70%,transparent 100%),linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}
.sl{background:linear-gradient(180deg,var(--blue-l),var(--blue) 45%,var(--pink));-webkit-mask-image:var(--cut),linear-gradient(to bottom,#000 70%,transparent 100%),linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in,source-in;mask-image:var(--cut),linear-gradient(to bottom,#000 70%,transparent 100%),linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect,intersect}
.sl.bk{background:linear-gradient(165deg,var(--blue),#0d0e10 55%,var(--pink));display:grid;place-content:center;text-align:center;color:#fff}
.sl.bk b{font:800 72px var(--display);letter-spacing:-.04em;margin-top:30px}
.sl.bk b i{font-style:normal;color:var(--pink-l)}
.ph{filter:drop-shadow(0 0 18px rgba(0,123,167,.55))}
.floor{position:absolute;left:0;top:0;transform:translateY(152px) rotateX(90deg);transform-style:flat}
.floor i{position:absolute;border-radius:50%;border:2px solid var(--blue-l);left:-150px;top:-150px;width:300px;height:300px;box-shadow:0 0 28px var(--blue),inset 0 0 28px rgba(0,123,167,.6);background:radial-gradient(circle,rgba(0,123,167,.45),transparent 70%)}
.floor i:nth-child(2){left:-205px;top:-205px;width:410px;height:410px;border:2px dashed var(--pink);box-shadow:0 0 22px var(--pink);background:none;animation:spin 14s linear infinite}
.floor i:nth-child(3){left:-250px;top:-250px;width:500px;height:500px;border:1px solid rgba(255,255,255,.22);box-shadow:none;background:none;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);opacity:.35}}
.chip3{position:absolute;left:0;top:0;white-space:nowrap;padding:7px 15px;border-radius:999px;background:rgba(18,20,22,.88);border:1px solid var(--c);font:600 14px var(--body);color:var(--ink);box-shadow:0 0 18px -4px var(--c)}
.chip3 i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px;box-shadow:0 0 8px var(--c)}
.hint{position:absolute;bottom:4px;font-size:14px;color:var(--mute);z-index:2}
.about h2{font-size:clamp(30px,4vw,44px);font-weight:800;margin-bottom:16px}
.about p{color:#cfd4da;max-width:560px;margin:0 0 14px}
@media(max-width:860px){.about{grid-template-columns:1fr;gap:0}.stage{height:460px}.zoom{transform:scale(.7)}}
/* sections */
section{padding:96px 0}
.sec{display:grid;grid-template-columns:230px 1fr;gap:40px}
.sec>header{position:sticky;top:96px;align-self:start}
.sec h2{font-size:clamp(30px,4vw,44px);font-weight:800}
.sec header p{color:var(--mute);font-size:15px;margin:12px 0 0}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}
.stat{padding:30px 22px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{display:block;font:800 clamp(38px,5vw,60px)/1 var(--display);letter-spacing:-.03em}
.stat:nth-child(odd) b{color:var(--blue-l)}
.stat:nth-child(even) b{color:var(--pink)}
.stat span{color:var(--mute);font-size:15px}
/* skills */
.skills{display:grid;gap:22px}
.skills h3{font-size:19px;margin-bottom:10px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:15px;transition:.2s}
.chip:hover{border-color:var(--pink);color:var(--pink-l);transform:translateY(-2px)}
/* timeline */
.tl{position:relative;padding-left:34px;border-left:2px solid var(--line)}
.job{position:relative;margin-bottom:46px}
.job::before{content:"";position:absolute;left:-43px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--blue)}
.job.now::before{border-color:var(--pink);box-shadow:0 0 0 6px rgba(255,45,149,.18)}
.job .when{color:var(--blue-l);font-size:15px;font-weight:600}
.job h3{font-size:26px;margin:4px 0 2px}
.job .co{color:var(--mute);margin-bottom:14px;font-size:15px}
.job ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.job li{padding-left:20px;position:relative;color:#cfd4da;font-size:16px}
.job li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:2px;background:var(--pink)}
.job li b{color:var(--ink)}
/* projects/edu */
.proj{border:1px solid var(--line);border-radius:20px;padding:30px;background:linear-gradient(150deg,rgba(0,123,167,.14),transparent 55%),var(--panel)}
.proj h3{font-size:28px;margin-bottom:10px}
.proj p{color:#cfd4da;margin:0 0 14px}
.proj .chips{margin-bottom:22px}
.edu{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.edu div{border-left:3px solid var(--pink);padding:2px 0 2px 16px}
.edu strong{display:block;font:600 18px var(--display)}
.edu span{color:var(--mute);font-size:15px}
/* contact */
.contact{text-align:left;border-top:1px solid var(--line)}
.contact h2{font-size:clamp(40px,7vw,88px);font-weight:800;max-width:860px}
.contact h2 em{font-style:normal;color:var(--pink)}
.contact p{color:var(--mute);max-width:520px;margin:22px 0 30px}
footer{padding:28px 0 44px;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:860px){
 .hero,.sec{grid-template-columns:1fr}.sec>header{position:static}
 .stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
 nav ul{display:none}.edu{grid-template-columns:1fr}section{padding:64px 0}.hero{padding-top:44px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ---------- data (from resume) ---------- */
const ROLES = ["Senior Frontend Engineer", "React & Next.js specialist", "Performance and accessibility obsessive"];
const STATS = [
  { to: 4, suffix: "+", label: "years building regulated finance and health apps" },
  { to: 35, suffix: "%", label: "smaller initial JavaScript payload with RSC" },
  { to: 40, suffix: "%", label: "lower API latency through a BFF layer" },
  { to: 22, suffix: "%", label: "more organic search acquisition" },
];
const SKILLS = {
  "Frameworks": ["React 18/19", "Next.js App Router", "React Server Components", "TypeScript", "JavaScript ES6+"],
  "State and data": ["Redux Toolkit", "React Query", "Zustand", "GraphQL"],
  "Performance": ["Core Web Vitals", "LCP / INP / CLS", "React 19 Compiler", "Code splitting", "Memoization"],
  "UI and design systems": ["Tailwind CSS", "Material-UI", "Responsive design", "Semantic HTML"],
  "Testing and accessibility": ["Jest", "React Testing Library", "Playwright", "axe-core", "WCAG 2.1 AA"],
  "Architecture and delivery": ["Backend-for-Frontend", "OAuth 2.0 (PKCE)", "CI/CD", "Git"],
};
const JOBS = [
  { now: true, when: "Mar 2024 – Present", title: "Prudential Health Insurance", co: "Enterprise Corporate Portal · Niveus Solutions", pts: [
    <>Built a high-traffic healthcare portal on Next.js 14 App Router, TypeScript and GraphQL, moving legacy client rendering to <b>React Server Components</b> and cutting the initial JS payload by <b>35%</b>.</>,
    <>Brought <b>LCP from 3.2s down to 1.4s</b> with route-level code splitting, lazy loading and concurrent features like useTransition, keeping <b>INP under 180ms</b> on every core journey.</>,
    <>Drove a <b>22% rise in organic search acquisition</b> with a programmatic SEO setup: dynamic metadata and structured schema markup.</>] },
  { when: "Jan 2022 – Feb 2024", title: "Global Banking Platform", co: "Customer Service & Transactions · Niveus Solutions", pts: [
    <>Architected a component library in React, TypeScript and Tailwind with <b>WCAG 2.1 AA</b> enforced by axe-core and Playwright checks in CI/CD.</>,
    <>Designed a <b>Backend-for-Frontend</b> layer in Next.js that removed network waterfalls and cut API latency by <b>40%</b> in cross-border transaction flows.</>,
    <>Hardened security with <b>OAuth 2.0 + PKCE</b> and fixes for XSS and CSRF, meeting strict financial data protection rules.</>,
    <>Built server-state caching and async sync with Redux Toolkit and React Query, including optimistic updates and resilient error handling.</>,
    <>Redesigned onboarding and sign-in with state-driven form validation and CAPTCHA, reducing drop-off by <b>15%</b>.</>] },
];

/* ---------- hooks ---------- */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.classList.add("in"); io.disconnect(); } }, { threshold: .15 });
    io.observe(el); return () => io.disconnect();
  }, []);
  return ref;
}
function useTyper(words) {
  const [out, setOut] = useState("");
  useEffect(() => {
    let w = 0, i = 0, del = false, t;
    const tick = () => {
      const full = words[w];
      i += del ? -1 : 1; setOut(full.slice(0, i));
      let d = del ? 30 : 70;
      if (!del && i === full.length) { del = true; d = 1600; }
      else if (del && i === 0) { del = false; w = (w + 1) % words.length; d = 300; }
      t = setTimeout(tick, d);
    };
    t = setTimeout(tick, 600); return () => clearTimeout(t);
  }, []);
  return out;
}
function Counter({ to, suffix }) {
  const [n, setN] = useState(0); const ref = useRef(null);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return; io.disconnect();
      const s = performance.now();
      const step = (t) => { const p = Math.min((t - s) / 1200, 1); setN(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }, { threshold: .6 });
    io.observe(ref.current); return () => io.disconnect();
  }, []);
  return <b ref={ref}>{n}{suffix}</b>;
}
function Reveal({ children, className = "" }) { const r = useReveal(); return <div ref={r} className={"reveal " + className}>{children}</div>; }

/* ---------- components ---------- */
function Nav() {
  return (
    <nav><div className="wrap">
      <a className="logo" href="#top" aria-label="Shreyas Acharya, home">SA<i>.</i></a>
      <ul>{["Impact", "Skills", "Experience", "Projects"].map(s => <li key={s}><a href={"#" + s.toLowerCase()}>{s}</a></li>)}</ul>
      <a className="btn pri sm" href="#contact">Hire me</a>
    </div></nav>
  );
}

/* The memorable moment: toggle between the legacy and RSC build and watch the numbers move. */
function RenderLab() {
  const [fast, setFast] = useState(true);
  const lcp = fast ? 1.4 : 3.2, js = fast ? 65 : 100;
  return (
    <div className="lab" aria-label="Interactive before and after comparison">
      <div className="tabs" role="group" aria-label="Build version">
        <button aria-pressed={!fast} onClick={() => setFast(false)}>Legacy client rendering</button>
        <button className="fast" aria-pressed={fast} onClick={() => setFast(true)}>Server Components</button>
      </div>
      <div className="mock">
        <div className="bar"><i/><i/><i/></div>
        <div className="body">
          {[100, 70, 90, 55].map((w, k) => <div key={k + String(fast)} className={"sk " + (fast ? "real" + (k % 2 ? " p" : "") : "")} style={{ width: w + "%", transition: "all .6s " + k * .12 + "s" }} />)}
        </div>
      </div>
      <div className="meter">
        <div className="t"><span>Largest Contentful Paint</span><strong style={{ color: fast ? "var(--pink)" : "var(--blue-l)" }}>{lcp.toFixed(1)}s</strong></div>
        <div className="track"><div style={{ width: (lcp / 3.2 * 100) + "%", background: fast ? "var(--pink)" : "var(--blue)" }} /></div>
      </div>
      <div className="meter">
        <div className="t"><span>Initial JavaScript</span><strong style={{ color: fast ? "var(--pink)" : "var(--blue-l)" }}>{js}%</strong></div>
        <div className="track"><div style={{ width: js + "%", background: fast ? "var(--pink)" : "var(--blue)" }} /></div>
      </div>
    </div>
  );
}

function Hero() {
  const role = useTyper(ROLES);
  return (
    <header className="wrap hero" id="top">
      <div>
        <h1>Shreyas<span>Acharya</span></h1>
        <div className="role" aria-live="off">{role}<b /></div>
        <p className="lead">I build fast, accessible and secure web apps for banks and healthcare companies, where a slow page or a failed form has real consequences.</p>
        <div className="cta">
          <a className="btn pri" href="#contact">Let’s work together</a>
          <a className="btn sec" href="#experience">See my work</a>
        </div>
      </div>
      <Portrait3D />
    </header>
  );

const ORBIT = [["React", "#3cc0ec"], ["Next.js", "#f3f4f6"], ["TypeScript", "#007BA7"], ["GraphQL", "#ff2d95"], ["Redux", "#ff6db8"], ["Tailwind", "#3cc0ec"]];
function Portrait3D() {
  const [a, setA] = useState(18);
  const drag = useRef(null), paused = useRef(false);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let raf, last = performance.now();
    const loop = (t) => { const dt = t - last; last = t; if (!paused.current) setA(v => (v + dt * 0.04) % 360); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop); return () => cancelAnimationFrame(raf);
  }, []);
  const down = (e) => { drag.current = { x: e.clientX, a }; paused.current = true; e.currentTarget.setPointerCapture(e.pointerId); };
  const move = (e) => { if (drag.current) setA(drag.current.a + (e.clientX - drag.current.x) * 0.7); };
  const up = () => { drag.current = null; paused.current = false; };
  const R = 215;
  return (
    <div className="stage" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} role="img" aria-label="Rotating 3D figure of Shreyas Acharya surrounded by orbiting tech skills">
      <div className="zoom"><div className="scene" style={{ transform: "rotateX(-9deg)" }}>
        <div className="floor"><i /><i /><i /></div>
        <div className="fig" style={{ transform: `translateY(-24px) rotateY(${a}deg)`, "--cut": `url(${CUTOUT})` }}>
          {[0, 1, 2, 3, 4, 5, 6].map(i => <div key={i} className="sl" style={{ transform: `translateZ(${(i - 3) * 4.5}px)` }} />)}
          <div className="sl bk" style={{ transform: "rotateY(180deg) translateZ(14px)" }}><b>SA<i>.</i></b></div>
          <img className="ph fade" src={CUTOUT} alt="Shreyas Acharya" style={{ transform: "translateZ(14px)" }} />
        </div>
        {ORBIT.map(([name, c], k) => {
          const th = (-a * 0.8 + k * 60) * Math.PI / 180, x = R * Math.sin(th), z = R * Math.cos(th), y = Math.sin(k * 2.1) * 120 - 10;
          return <div key={name} className="chip3" style={{ "--c": c, opacity: .45 + .55 * (z + R) / (2 * R), transform: `translate3d(${x}px,${y}px,${z}px) translate(-50%,-50%)` }}><i />{name}</div>;
        })}
      </div></div>
      <span className="hint">Drag to spin</span>
    </div>
  );
}

function About() {
  return (
    <section style={{ padding: 0 }} id="about"><div className="wrap about">
      <RenderLab />
      <Reveal>
        <h2>Frontend for places where mistakes are expensive</h2>
        <p>I’m a Senior Frontend Engineer with over 4 years of experience building scalable web applications for the financial and healthcare sectors.</p>
        <p>My focus is rendering architecture with the Next.js App Router and React Server Components, state management with Redux Toolkit and React Query, and strictly typed, component-driven code. I also tune Core Web Vitals, enforce WCAG 2.1 AA and design Backend-for-Frontend layers.</p>
      </Reveal>
    </div></section>
  );
}

          <div><strong>Pre-University, Computer Science</strong><span>Vidyodaya PU College, Udupi · 2017</span></div>

      </div>
    </div></section>
  );
}

function Contact() {
  const [copied, setCopied] = useState(false);
  const mail = "shreyasgacharya@gmail.com";
  const copy = () => { try { navigator.clipboard.writeText(mail); } catch (e) {} setCopied(true); setTimeout(() => setCopied(false), 1800); };
  return (
    <section className="contact" id="contact"><div className="wrap">
      <Reveal>
        <h2>Have a product that needs to be <em>fast</em> and trusted?</h2>
        <p>I’m based in Udupi, Karnataka and open to senior frontend roles. Email is the quickest way to reach me.</p>
        <div className="cta">
          <a className="btn pri" href={"mailto:" + mail}>Email me</a>
          <button className="btn sec" onClick={copy}>{copied ? "Email copied" : "Copy email address"}</button>
          <a className="btn sec" href="https://linkedin.com/in/shreyas-acharyag" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>
      </Reveal>
    </div></section>

}

function App() {
  useEffect(() => {
    const bg = document.getElementById("bg");
    const mv = (e) => { bg.style.setProperty("--mx", e.clientX + "px"); bg.style.setProperty("--my", e.clientY + "px"); };
    window.addEventListener("pointermove", mv); return () => window.removeEventListener("pointermove", mv);
  }, []);
  return (<>
    <Nav /><Hero /><About /><Stats /><Skills /><Experience /><Projects /><Contact />
    <footer><div className="wrap"><span>© 2026 Shreyas Acharya</span><span>+91 84948 28487 · Udupi, Karnataka</span></div></footer>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
